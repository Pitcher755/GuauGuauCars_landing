<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registrar Mascota</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
      :root {
        --select-button-svg: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27%233B5954%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e');
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#44A682",
              "background-light": "#f6f8f7",
              "background-dark": "#11211b",
              "dark-accent": "#3B5954",
              "surface": "#F5F5F5",
            },
            fontFamily: {
              "display": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display group/design-root overflow-x-hidden antialiased">
<div class="flex flex-col flex-1">
<!-- TopAppBar -->
<header class="sticky top-0 z-10 flex h-16 items-center bg-background-light dark:bg-background-dark px-4 shadow-sm shadow-black/[0.05]">
<button class="text-dark-accent dark:text-background-light flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-dark-accent dark:text-background-light text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Registrar Mascota</h1>
</header>
<!-- Form Content -->
<main class="flex-1 px-4 py-6">
<div class="flex flex-col gap-6">
<!-- Nombre TextField -->
<label class="flex flex-col w-full">
<p class="text-dark-accent dark:text-background-light/80 text-base font-medium leading-normal pb-2">Nombre</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-dark-accent dark:text-white focus:outline-0 border border-gray-300 dark:border-gray-700 bg-surface dark:bg-gray-800 focus:border-primary focus:ring-2 focus:ring-primary/30 h-14 placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Ej: Fido" value=""/>
</label>
<!-- Especie Select Field -->
<label class="flex flex-col w-full">
<p class="text-dark-accent dark:text-background-light/80 text-base font-medium leading-normal pb-2">Especie</p>
<div class="relative w-full">
<select class="form-select appearance-none flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-dark-accent dark:text-white focus:outline-0 border border-gray-300 dark:border-gray-700 bg-surface dark:bg-gray-800 focus:border-primary focus:ring-2 focus:ring-primary/30 h-14 placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal pr-10" style="background-image: var(--select-button-svg); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 1.5em 1.5em;">
<option disabled="" selected="" value="">Selecciona una especie</option>
<option value="perro">Perro</option>
<option value="gato">Gato</option>
<option value="otro">Otro</option>
</select>
</div>
</label>
<!-- Tamaño SegmentedButtons -->
<div class="flex flex-col w-full">
<p class="text-dark-accent dark:text-background-light/80 text-base font-medium leading-normal pb-2">Tamaño</p>
<div class="flex h-12 w-full items-center justify-center rounded-lg bg-surface dark:bg-gray-800 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-gray-900 has-[:checked]:shadow-sm has-[:checked]:text-primary text-dark-accent/70 dark:text-background-light/70 text-sm font-semibold leading-normal transition-colors duration-200">
<span class="truncate">Pequeño</span>
<input checked="" class="invisible w-0" name="pet-size" type="radio" value="Pequeño"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-gray-900 has-[:checked]:shadow-sm has-[:checked]:text-primary text-dark-accent/70 dark:text-background-light/70 text-sm font-semibold leading-normal transition-colors duration-200">
<span class="truncate">Mediano</span>
<input class="invisible w-0" name="pet-size" type="radio" value="Mediano"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-gray-900 has-[:checked]:shadow-sm has-[:checked]:text-primary text-dark-accent/70 dark:text-background-light/70 text-sm font-semibold leading-normal transition-colors duration-200">
<span class="truncate">Grande</span>
<input class="invisible w-0" name="pet-size" type="radio" value="Grande"/>
</label>
</div>
</div>
<!-- Necesidades Especiales TextArea -->
<label class="flex flex-col w-full">
<p class="text-dark-accent dark:text-background-light/80 text-base font-medium leading-normal pb-2">Necesidades Especiales</p>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-dark-accent dark:text-white focus:outline-0 border border-gray-300 dark:border-gray-700 bg-surface dark:bg-gray-800 focus:border-primary focus:ring-2 focus:ring-primary/30 min-h-36 placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Ej: Medicación diaria, necesita jaula grande"></textarea>
</label>
</div>
</main>
</div>
<!-- Bottom Action Button -->
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark p-4 border-t border-gray-200 dark:border-gray-800">
<button class="w-full bg-primary text-white font-bold h-14 rounded-lg text-base flex items-center justify-center shadow-lg shadow-primary/30 hover:bg-primary/90 active:bg-primary/80 transition-colors">
            Guardar Mascota
        </button>
</footer>
</div>
</body></html>
