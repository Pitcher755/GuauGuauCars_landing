<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mis Animales - GuauGuauCars</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#44A682",
                        "background-light": "#f6f8f7",
                        "background-dark": "#3B5954",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col">
<!-- Top App Bar -->
<header class="flex items-center p-4 pb-2 justify-between shrink-0">
<div class="flex size-12 shrink-0 items-center justify-start text-[#E0E0E0]">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em] text-[#E0E0E0]">Mis Animales</h1>

<div class="flex flex-col gap-3">

<div class="flex items-center gap-4 bg-[#4A6D68] px-4 min-h-[72px] py-2 justify-between rounded-xl">

<span class="material-symbols-outlined text-2xl text-[#E0E0E0]">pets</span>
</div>
<div class="flex flex-col justify-center">

</div>
</div>
<div class="shrink-0">
<div class="flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-2xl text-[#E0E0E0]">chevron_right</span>
</div>
</div>
</div>
<!-- List Item 2 -->
<div class="flex items-center gap-4 bg-[#4A6D68] px-4 min-h-[72px] py-2 justify-between rounded-xl">
<div class="flex items-center gap-4">
<div class="flex size-12 shrink-0 items-center justify-center rounded-lg bg-[#3B5954]">
<span class="material-symbols-outlined text-2xl text-[#E0E0E0]">pets</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-base font-medium leading-normal text-[#E0E0E0] line-clamp-1">Mishi</p>
<p class="text-sm font-normal leading-normal text-[#B0C0BE] line-clamp-2">Gato</p>
</div>
</div>
<div class="shrink-0">
<div class="flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-2xl text-[#E0E0E0]">chevron_right</span>
</div>
</div>
</div>
<!-- List Item 3 -->
<div class="flex items-center gap-4 bg-[#4A6D68] px-4 min-h-[72px] py-2 justify-between rounded-xl">
<div class="flex items-center gap-4">
<div class="flex size-12 shrink-0 items-center justify-center rounded-lg bg-[#3B5954]">
<span class="material-symbols-outlined text-2xl text-[#E0E0E0]">flutter_dash</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-base font-medium leading-normal text-[#E0E0E0] line-clamp-1">Piolín</p>
<p class="text-sm font-normal leading-normal text-[#B0C0BE] line-clamp-2">Pájaro</p>
</div>
</div>

<div class="flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-2xl text-[#E0E0E0]">chevron_right</span>
</div>
</div>
</div>

<span class="material-symbols-outlined text-4xl">add</span>
</button>
