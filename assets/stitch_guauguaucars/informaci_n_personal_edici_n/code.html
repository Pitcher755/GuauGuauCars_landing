<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Editar Perfil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#44A682",
              "background-light": "#f6f8f7",
              "background-dark": "#151d1a",
              "surface-dark": "#1f2a25",
              "header": "#3B5954"
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden" style="max-width: 480px; margin: auto;">
<!-- Top App Bar -->
<header class="flex items-center p-4 pb-3 bg-header text-white sticky top-0 z-10">
<button class="flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Editar Perfil</h1>
</header>
<!-- Main Content -->
<main class="flex flex-1 flex-col px-4 pt-6 pb-8">
<!-- Profile Header -->
<div class="flex w-full flex-col gap-4 items-center mb-8">
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 border-4 border-white dark:border-surface-dark shadow-md" data-alt="User's profile picture" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuALM9CSpE6bbsj2zsup5dInn7pugL442vs4GY_yLtcQYvhLS68lN1FT2gprzaaT5g4lzU15MxCl4DlCQNcR3-9X7e5Q1QI2C0R1a6jf662xIbAdiJFLuH6z1c9vfnHG3ngyWs1qavckQ9bCbMJk3De3pCpraqWBOv8csLFFXeZ8HIcLBLmvcKIYQhB8TDFtV05gZyiSGpQv6tDoM-a45tGgNWNTQMXZYqeHEDfIwBHrv2U53_unDMJuYdjw_mtia6GPaqnBURI5Id7-");'></div>
<button class="absolute bottom-0 right-0 flex items-center justify-center size-9 bg-primary text-white rounded-full border-2 border-white dark:border-surface-dark">
<span class="material-symbols-outlined text-xl">photo_camera</span>
</button>
</div>
<p class="text-primary text-lg font-bold leading-tight tracking-[-0.015em] text-center">Cambiar foto</p>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-4">
<!-- Nombre TextField -->
<label class="flex flex-col w-full">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Nombre</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-surface-dark h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal" value="Daniela Alvarez"/>
</label>
<!-- Email TextField -->
<label class="flex flex-col w-full">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Correo Electrónico</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-surface-dark h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal" value="daniela.alvarez@email.com"/>
</label>
<!-- Contraseña TextField -->
<label class="flex flex-col w-full">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Contraseña</p>
<div class="flex w-full flex-1 items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-gray-900 dark:text-gray-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-surface-dark h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Nueva contraseña" type="password" value="password123"/>
<button class="text-gray-500 dark:text-gray-400 flex border border-gray-300 dark:border-gray-600 bg-white dark:bg-surface-dark items-center justify-center px-4 rounded-r-lg border-l-0">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
</div>
</main>
<!-- Action Buttons -->
<footer class="p-4 pt-2 mt-auto bg-background-light dark:bg-background-dark sticky bottom-0">
<div class="flex flex-col gap-4">
<button class="flex items-center justify-center w-full h-14 px-6 rounded-xl border border-primary text-primary text-base font-bold transition-colors hover:bg-primary/10">Gestionar Mis Animales</button>
<button class="flex items-center justify-center w-full h-14 px-6 rounded-xl bg-primary text-white text-base font-bold transition-colors hover:bg-primary/90">Guardar Cambios</button>
</div>
</footer>
</div>
</body></html>
