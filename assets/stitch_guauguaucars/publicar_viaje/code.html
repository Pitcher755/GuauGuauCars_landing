<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Crear Oferta de Viaje</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#44A682",
              "background-light": "#F7F7F7",
              "background-dark": "#1d2c2a",
              "surface-light": "#ffffff",
              "surface-dark": "#2a3f3c",
              "header": "#3B5954",
              "text-light-primary": "#111715",
              "text-dark-primary": "#e1e3e2",
              "text-light-secondary": "#64748b",
              "text-dark-secondary": "#94a3b8",
              "border-light": "#dce5e1",
              "border-dark": "#4a5e5b"
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col group/design-root">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex h-16 items-center justify-between bg-header px-4 shadow-sm">
<button class="flex size-10 items-center justify-center text-white">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-white">Crear Oferta de Viaje</h1>
<div class="size-10"></div> <!-- Spacer for centering title -->
</header>
<main class="flex-1 px-4 pb-28 pt-6">
<div class="mx-auto max-w-lg space-y-8">
<!-- Detalles del Viaje Section -->
<section class="space-y-4">
<h2 class="text-2xl font-bold leading-tight tracking-tight text-text-light-primary dark:text-text-dark-primary">Detalles del Viaje</h2>
<!-- Origen Input -->
<div class="flex flex-col">
<label class="mb-2 text-base font-medium text-text-light-primary dark:text-text-dark-primary" for="origen">Origen</label>
<div class="relative flex w-full items-center">
<input class="form-input h-14 w-full flex-1 rounded-lg border border-border-light bg-surface-light p-4 pr-12 text-base text-text-light-primary placeholder-text-light-secondary focus:border-primary focus:ring-2 focus:ring-primary/30 dark:border-border-dark dark:bg-surface-dark dark:text-text-dark-primary dark:placeholder-text-dark-secondary dark:focus:border-primary" id="origen" placeholder="Introduce la dirección de recogida" type="text"/>
<span class="material-symbols-outlined absolute right-4 text-text-light-secondary dark:text-text-dark-secondary">my_location</span>
</div>
</div>
<!-- Destino Input -->
<div class="flex flex-col">
<label class="mb-2 text-base font-medium text-text-light-primary dark:text-text-dark-primary" for="destino">Destino</label>
<div class="relative flex w-full items-center">
<input class="form-input h-14 w-full flex-1 rounded-lg border border-border-light bg-surface-light p-4 pr-12 text-base text-text-light-primary placeholder-text-light-secondary focus:border-primary focus:ring-2 focus:ring-primary/30 dark:border-border-dark dark:bg-surface-dark dark:text-text-dark-primary dark:placeholder-text-dark-secondary dark:focus:border-primary" id="destino" placeholder="Introduce la dirección de entrega" type="text"/>
<span class="material-symbols-outlined absolute right-4 text-text-light-secondary dark:text-text-dark-secondary">location_on</span>
</div>
</div>
<!-- Fecha y Hora Inputs -->
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
<div class="flex flex-col">
<label class="mb-2 text-base font-medium text-text-light-primary dark:text-text-dark-primary" for="fecha">Fecha</label>
<div class="relative flex w-full items-center">
<input class="form-input h-14 w-full flex-1 rounded-lg border border-border-light bg-surface-light p-4 pr-12 text-base text-text-light-primary placeholder-text-light-secondary focus:border-primary focus:ring-2 focus:ring-primary/30 dark:border-border-dark dark:bg-surface-dark dark:text-text-dark-primary dark:placeholder-text-dark-secondary dark:focus:border-primary" id="fecha" onblur="(this.type='text')" onfocus="(this.type='date')" placeholder="DD/MM/AAAA" type="text"/>
<span class="material-symbols-outlined pointer-events-none absolute right-4 text-text-light-secondary dark:text-text-dark-secondary">calendar_today</span>
</div>
</div>
<div class="flex flex-col">
<label class="mb-2 text-base font-medium text-text-light-primary dark:text-text-dark-primary" for="hora">Hora</label>
<div class="relative flex w-full items-center">
<input class="form-input h-14 w-full flex-1 rounded-lg border border-border-light bg-surface-light p-4 pr-12 text-base text-text-light-primary placeholder-text-light-secondary focus:border-primary focus:ring-2 focus:ring-primary/30 dark:border-border-dark dark:bg-surface-dark dark:text-text-dark-primary dark:placeholder-text-dark-secondary dark:focus:border-primary" id="hora" onblur="(this.type='text')" onfocus="(this.type='time')" placeholder="HH:MM" type="text"/>
<span class="material-symbols-outlined pointer-events-none absolute right-4 text-text-light-secondary dark:text-text-dark-secondary">schedule</span>
</div>
</div>
</div>
</section>
<!-- Detalles de la Oferta Section -->
<section class="space-y-4">
<h2 class="text-2xl font-bold leading-tight tracking-tight text-text-light-primary dark:text-text-dark-primary">Detalles de la Oferta</h2>
<!-- Capacidad Input -->
<div class="flex flex-col">
<label class="mb-2 text-base font-medium text-text-light-primary dark:text-text-dark-primary" for="capacidad">Capacidad (Nº de animales)</label>
<div class="relative flex h-14 w-full items-center justify-between rounded-lg border border-border-light bg-surface-light p-2 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/30 dark:border-border-dark dark:bg-surface-dark dark:focus-within:border-primary">
<button class="flex size-10 items-center justify-center rounded-md text-primary transition-colors hover:bg-primary/10" type="button">
<span class="material-symbols-outlined text-2xl">remove</span>
</button>
<input class="w-16 border-0 bg-transparent p-0 text-center text-lg font-semibold text-text-light-primary focus:ring-0 dark:text-text-dark-primary" id="capacidad" min="1" type="number" value="1"/>
<button class="flex size-10 items-center justify-center rounded-md text-primary transition-colors hover:bg-primary/10" type="button">
<span class="material-symbols-outlined text-2xl">add</span>
</button>
</div>
</div>
<!-- Precio Input -->
<div class="flex flex-col">
<label class="mb-2 text-base font-medium text-text-light-primary dark:text-text-dark-primary" for="priceDriver">Precio que desea recibir</label>
<div class="relative flex w-full items-center">
<input class="form-input h-14 w-full flex-1 rounded-lg border border-border-light bg-surface-light p-4 pl-12 text-base text-text-light-primary placeholder-text-light-secondary focus:border-primary focus:ring-2 focus:ring-primary/30 dark:border-border-dark dark:bg-surface-dark dark:text-text-dark-primary dark:placeholder-text-dark-secondary dark:focus:border-primary" id="priceDriver" placeholder="0.00" type="number"/>
<span class="material-symbols-outlined absolute left-4 text-lg text-text-light-secondary dark:text-text-dark-secondary">euro</span>
</div>
<p class="mt-2 text-sm text-text-light-secondary dark:text-text-dark-secondary">El precio final que paga el pasajero incluye este monto más la comisión del 25% y tarifas de pasarela.</p>
</div>
</section>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 right-0 z-10 bg-surface-light/80 p-4 backdrop-blur-sm dark:bg-surface-dark/80">
<div class="mx-auto max-w-lg">
<button class="h-14 w-full rounded-full bg-primary text-lg font-bold text-white transition-transform hover:scale-[1.02] active:scale-[0.98]">Publicar Oferta</button>
</div>
</footer>
</div>
</body></html>
