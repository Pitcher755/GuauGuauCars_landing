<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GuauGuauCars - Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#44a782",
              "background-light": "#f6f7f7",
              "background-dark": "#151d1a",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display group/design-root overflow-x-hidden" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-[#131615] dark:text-white flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-[#131615] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">GuauGuauCars</h2>
</div>
<main class="flex flex-col flex-1 px-4 py-8">
<!-- Headline Text -->
<h1 class="text-[#131615] dark:text-white tracking-light text-[32px] font-bold leading-tight text-center pb-8 pt-6">¡Hola de nuevo!</h1>
<!-- Form Fields -->
<div class="space-y-4">
<!-- Email Text Field -->
<div class="flex flex-col">
<label class="text-[#131615] dark:text-gray-300 text-base font-medium leading-normal pb-2" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#131615] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dee3e1] dark:border-gray-600 bg-white dark:bg-background-dark h-14 placeholder:text-[#6c7f78] dark:placeholder:text-gray-500 pl-12 pr-4 py-3 text-base font-normal leading-normal" id="email" placeholder="tu.correo@ejemplo.com" type="email" value=""/>
</div>
</div>
<!-- Password Text Field -->
<div class="flex flex-col">
<label class="text-[#131615] dark:text-gray-300 text-base font-medium leading-normal pb-2" for="password">Contraseña</label>
<div class="relative flex w-full flex-1 items-stretch">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#131615] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dee3e1] dark:border-gray-600 bg-white dark:bg-background-dark h-14 placeholder:text-[#6c7f78] dark:placeholder:text-gray-500 pl-12 pr-12 py-3 text-base font-normal leading-normal" id="password" placeholder="Introduce tu contraseña" type="password" value=""/>
<button class="text-[#6c7f78] dark:text-gray-400 absolute right-0 top-0 flex h-full items-center justify-center px-4" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Forgot Password Link -->
<div class="pt-4 text-right">
<a class="text-primary text-sm font-medium leading-normal underline" href="#">He olvidado mi contraseña</a>
</div>
<div class="flex-grow"></div>
<!-- Action Buttons & Footer Text -->
<div class="space-y-4 pt-12">
<!-- Primary Button -->
<button class="flex w-full items-center justify-center rounded-xl bg-primary h-14 px-6">
<span class="text-white text-base font-bold leading-normal">Iniciar Sesión</span>
</button>
<!-- Alternative Action -->
<p class="text-[#6c7f78] dark:text-gray-400 text-sm font-normal leading-normal text-center pt-2">
                    ¿No tienes una cuenta? <a class="font-bold text-primary" href="#">Regístrate</a>
</p>
</div>
</main>
</div>
</body></html>
