<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configuración - GuauGuauCars</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#44A682",
            "background-light": "#f6f8f7",
            "background-dark": "#3B5954",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-gray-800 dark:text-white">arrow_back</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em] text-gray-900 dark:text-white">Configuración</h1>
<div class="size-12 shrink-0"></div>
</header>
<main class="flex-grow px-4">
<!-- Section: Apariencia -->
<section class="mt-4">
<h2 class="text-primary text-sm font-bold uppercase tracking-wide px-4 pb-2 pt-4">Apariencia</h2>
<div class="flex items-center gap-4 bg-background-light dark:bg-background-dark/30 rounded-xl px-4 min-h-[56px] justify-between">
<div class="flex items-center gap-4">
<div class="text-gray-800 dark:text-white flex shrink-0 items-center justify-center">
<span class="material-symbols-outlined">dark_mode</span>
</div>
<p class="text-base font-normal leading-normal text-gray-900 dark:text-white">Tema Oscuro</p>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full bg-gray-600/30 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
</section>
<!-- Section: Notificaciones Push -->
<section class="mt-6">
<h2 class="text-primary text-sm font-bold uppercase tracking-wide px-4 pb-2 pt-4">Notificaciones Push</h2>
<div class="flex flex-col gap-px overflow-hidden rounded-xl bg-gray-500/10">
<!-- ListItem 1 -->
<div class="flex items-center gap-4 bg-background-light dark:bg-background-dark/30 px-4 min-h-[56px] justify-between">
<div class="flex items-center gap-4">
<div class="text-gray-800 dark:text-white flex shrink-0 items-center justify-center">
<span class="material-symbols-outlined">chat_bubble</span>
</div>
<p class="text-base font-normal leading-normal text-gray-900 dark:text-white">Alertas de mensajes de chat</p>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full bg-gray-600/30 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<!-- ListItem 2 -->
<div class="flex items-center gap-4 bg-background-light dark:bg-background-dark/30 px-4 min-h-[56px] justify-between">
<div class="flex items-center gap-4">
<div class="text-gray-800 dark:text-white flex shrink-0 items-center justify-center">
<span class="material-symbols-outlined">confirmation_number</span>
</div>
<p class="text-base font-normal leading-normal text-gray-900 dark:text-white">Alertas de estado de reservas</p>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full bg-gray-600/30 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<!-- ListItem 3 -->
<div class="flex items-center gap-4 bg-background-light dark:bg-background-dark/30 px-4 min-h-[56px] justify-between">
<div class="flex items-center gap-4">
<div class="text-gray-800 dark:text-white flex shrink-0 items-center justify-center">
<span class="material-symbols-outlined">campaign</span>
</div>
<p class="text-base font-normal leading-normal text-gray-900 dark:text-white">Promociones y novedades</p>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full bg-gray-600/30 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
</div>
</section>
<!-- Section: Cuenta -->
<section class="mt-6">
<h2 class="text-primary text-sm font-bold uppercase tracking-wide px-4 pb-2 pt-4">Cuenta</h2>
<button class="flex w-full items-center justify-center gap-3 rounded-xl bg-red-600/10 dark:bg-red-500/20 px-4 py-3 text-red-600 dark:text-red-400 hover:bg-red-600/20 dark:hover:bg-red-500/30 transition-colors">
<span class="material-symbols-outlined">logout</span>
<span class="text-base font-bold">Cerrar Sesión</span>
</button>
</section>
</main>
</div>
</body></html>
